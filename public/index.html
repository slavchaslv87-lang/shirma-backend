<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silent Match</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        video {
            width: 100%;
            height: 50%;
            object-fit: cover;
            background-color: #222;
        }
        .game-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #ff4757;
            max-width: 80%;
            z-index: 10;
        }
        .btn {
            background: #ff4757;
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .report-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 0, 0, 0.6);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 12px;
            z-index: 11;
        }
    </style>
</head>
<body>

    <button class="report-btn" onclick="reportUser()">⚠️ Пожаловаться</button>

    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div class="game-overlay">
        <div id="gameTask">Нажмите «Искать пару», чтобы начать молчаливую игру</div>
        <button class="btn" id="actionBtn" onclick="startSearch()">Искать пару</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io(); 
        
        let localStream;
        let peerConnection;
        let currentRoomId;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:://google.com' }
            ]
        };

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const gameTask = document.getElementById('gameTask');
        const actionBtn = document.getElementById('actionBtn');

        const tasks = [
            "ПРАВДА: Кивни, если веришь в любовь с первого взгляда. Нет? Помотай головой.",
            "ДЕЙСТВИЕ: Покажи самую смешную гримасу в камеру прямо сейчас!",
            "ПРАВДА: Подмигни левым глазом, если ты любишь пиццу больше, чем суши.",
            "ДЕЙСТВИЕ: Сделай серьезное лицо каменного сфинкса и не улыбайся 10 секунд.",
            "ДЕЙСТВИЕ: Покажи руками сердечко ❤️ собеседнику!"
        ];

        async function startSearch() {
            gameTask.innerText = "Запрашиваем камеру...";
            actionBtn.style.display = 'none';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                localVideo.srcObject = localStream;
                
                gameTask.innerText = "Ищем свободного собеседника...";
                socket.emit('search-match');
            } catch (err) {
                alert("Для игры обязательно нужен доступ к камере! Ошибка: " + err);
                actionBtn.style.display = 'block';
                gameTask.innerText = "Нажмите «Искать пару», чтобы начать молчаливую игру";
            }
        }

        socket.on('match-found', async (data) => {
            currentRoomId = data.roomId;
            gameTask.innerText = "Собеседник найден! Начинаем молчаливую игру...";
            
            createPeerConnection();

            if (data.initiator) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('webrtc-signal', { roomId: currentRoomId, signal: offer });
            }
        });

        socket.on('webrtc-signal', async (data) => {
            if (data.signal.type === 'offer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('webrtc-signal', { roomId: currentRoomId, signal: answer });
            } else if (data.signal.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
            } else if (data.signal.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal.candidate));
            }
        });

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams;
                startGameRound();
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('webrtc-signal', { roomId: currentRoomId, signal: { candidate: event.candidate } });
                }
            };
        }

        function startGameRound() {
            const randomTask = tasks[Math.floor(Math.random() * tasks.length)];
            gameTask.innerText = randomTask;
            
            actionBtn.style.display = 'inline-block';
            actionBtn.innerText = "Я выполнил(а) ✅";
            actionBtn.onclick = confirmTaskDone;
        }

        function confirmTaskDone() {
            actionBtn.style.display = 'none';
            gameTask.innerText = "Ожидаем подтверждения от собеседника...";
            socket.emit('game-action-done', { roomId: currentRoomId });
        }

        socket.on('peer-game-done', () => {
            gameTask.innerHTML = "<span style='color: #4cd137;'>🔥 МЭТЧ! 🔥</span><br>Вы оба справились! Клавиатура и микрофон разблокированы.";
            actionBtn.style.display = 'inline-block';
            actionBtn.innerText = "Следующий раунд ➡️";
            actionBtn.onclick = () => { location.reload(); };
            
            alert("Поздравляем! Вы открыли общение.");
        });

        function reportUser() {
            alert("Пользователь заблокирован. Ищем нового...");
            location.reload();
        }
    </script>
</body>
</html>
